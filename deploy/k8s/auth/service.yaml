apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: nexapay
  labels:
    app: auth-service
    tier: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "4001"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 4001
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
  selector:
    app: auth-service
