apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: nexapay
  labels:
    app: notification-service
    tier: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
        tier: backend
    spec:
      serviceAccountName: nexapay-sa
      terminationGracePeriodSeconds: 60
      containers:
        - name: notification
          image: ${ECR_REGISTRY}/nexapay/notification:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4006
              protocol: TCP
            - name: ws
              containerPort: 4006
              protocol: TCP
          envFrom:
            - configMapRef:
                name: nexapay-config
            - secretRef:
                name: nexapay-secrets
          env:
            - name: SERVICE_NAME
              value: "notification"
            - name: SERVICE_PORT
              value: "4006"
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: nexapay-secrets
                  key: notification-mongo-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: nexapay-secrets
                  key: notification-redis-url
            - name: SENDGRID_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nexapay-secrets
                  key: sendgrid-api-key
            - name: TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: nexapay-secrets
                  key: twilio-account-sid
            - name: TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nexapay-secrets
                  key: twilio-auth-token
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: nexapay-secrets
                  key: smtp-pass
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - notification-service
                topologyKey: kubernetes.io/hostname
