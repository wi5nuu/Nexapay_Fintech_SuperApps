apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: nexapay
  labels:
    app: notification-service
    tier: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "4006"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 4006
      targetPort: http
      protocol: TCP
    - name: ws
      port: 4006
      targetPort: ws
      protocol: TCP
  selector:
    app: notification-service
