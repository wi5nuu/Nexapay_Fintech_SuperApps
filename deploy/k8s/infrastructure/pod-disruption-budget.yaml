apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: nexapay
  labels:
    app: api-gateway
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: api-gateway
