apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting-service
  namespace: nexapay
  labels:
    app: reporting-service
    tier: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: reporting-service
  template:
    metadata:
      labels:
        app: reporting-service
        tier: backend
    spec:
      serviceAccountName: nexapay-sa
      terminationGracePeriodSeconds: 60
      containers:
        - name: reporting
          image: ${ECR_REGISTRY}/nexapay/reporting:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4007
              protocol: TCP
          envFrom:
            - configMapRef:
                name: nexapay-config
            - secretRef:
                name: nexapay-secrets
          env:
            - name: SERVICE_NAME
              value: "reporting"
            - name: SERVICE_PORT
              value: "4007"
            - name: MYSQL_URL
              valueFrom:
                secretKeyRef:
                  name: nexapay-secrets
                  key: reporting-mysql-url
            - name: ELASTICSEARCH_URL
              valueFrom:
                secretKeyRef:
                  name: nexapay-secrets
                  key: reporting-es-url
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - reporting-service
                topologyKey: kubernetes.io/hostname
