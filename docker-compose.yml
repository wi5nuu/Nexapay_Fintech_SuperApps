x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck: &db-healthcheck
  interval: 15s
  timeout: 10s
  retries: 10
  start_period: 30s

services:
  # ==========================================================
  # POSTGRESQL (Auth, Users, Wallets, Loans)
  # ==========================================================
  postgres-auth:
    image: postgres:15-alpine
    container_name: nexapay-postgres-auth
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexapay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexapay_pass}
      POSTGRES_DB: nexapay_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
      - ./proto/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      <<: *db-healthcheck
      test: ["CMD-SHELL", "pg_isready -U nexapay -d nexapay_auth"]
    networks:
      - nexapay-backend

  postgres-users:
    image: postgres:15-alpine
    container_name: nexapay-postgres-users
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexapay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexapay_pass}
      POSTGRES_DB: nexapay_users
    ports:
      - "5433:5432"
    volumes:
      - postgres-users-data:/var/lib/postgresql/data
    healthcheck:
      <<: *db-healthcheck
      test: ["CMD-SHELL", "pg_isready -U nexapay -d nexapay_users"]
    networks:
      - nexapay-backend

  postgres-wallets:
    image: postgres:15-alpine
    container_name: nexapay-postgres-wallets
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexapay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexapay_pass}
      POSTGRES_DB: nexapay_wallets
    ports:
      - "5434:5432"
    volumes:
      - postgres-wallets-data:/var/lib/postgresql/data
    healthcheck:
      <<: *db-healthcheck
      test: ["CMD-SHELL", "pg_isready -U nexapay -d nexapay_wallets"]
    networks:
      - nexapay-backend

  postgres-loans:
    image: postgres:15-alpine
    container_name: nexapay-postgres-loans
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexapay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexapay_pass}
      POSTGRES_DB: nexapay_loans
    ports:
      - "5435:5432"
    volumes:
      - postgres-loans-data:/var/lib/postgresql/data
    healthcheck:
      <<: *db-healthcheck
      test: ["CMD-SHELL", "pg_isready -U nexapay -d nexapay_loans"]
    networks:
      - nexapay-backend

  # ==========================================================
  # MYSQL (Reporting/Analytics)
  # ==========================================================
  mysql:
    image: mysql:8.0
    container_name: nexapay-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
      MYSQL_DATABASE: nexapay_reporting
      MYSQL_USER: nexapay
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nexapay_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./proto/init-mysql.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      <<: *db-healthcheck
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "nexapay", "-p${MYSQL_PASSWORD:-nexapay_pass}"]
    networks:
      - nexapay-backend

  # ==========================================================
  # MONGODB (KYC docs, Investments, Notifications)
  # ==========================================================
  mongo:
    image: mongo:7
    container_name: nexapay-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: nexapay
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-nexapay_pass}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./proto/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      <<: *db-healthcheck
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
    networks:
      - nexapay-backend

  # ==========================================================
  # REDIS (Caching, Sessions, Rate Limiting)
  # ==========================================================
  redis:
    image: redis:7-alpine
    container_name: nexapay-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      <<: *db-healthcheck
      test: ["CMD", "redis-cli", "ping"]
    networks:
      - nexapay-backend

  # ==========================================================
  # ZOOKEEPER + KAFKA
  # ==========================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: nexapay-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      <<: *db-healthcheck
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
    networks:
      - nexapay-backend

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: nexapay-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_CONFLUENT_SCHEMA_REGISTRY_URL: http://schema-registry:8081
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      <<: *db-healthcheck
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
    networks:
      - nexapay-backend

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: nexapay-schema-registry
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT_INTERNAL://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports:
      - "8081:8081"
    networks:
      - nexapay-backend

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: nexapay-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: nexapay-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    ports:
      - "8080:8080"
    networks:
      - nexapay-backend

  # ==========================================================
  # ELASTICSEARCH + KIBANA
  # ==========================================================
  elasticsearch:
    image: elasticsearch:8.12.0
    container_name: nexapay-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - bootstrap.memory_lock=true
      - cluster.name=nexapay-es
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
      - ./deploy/docker/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      <<: *db-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
    networks:
      - nexapay-backend

  kibana:
    image: kibana:8.12.0
    container_name: nexapay-kibana
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ENTERPRISESEARCH_ENABLED: "false"
    ports:
      - "5601:5601"
    volumes:
      - ./deploy/docker/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    healthcheck:
      <<: *db-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:5601/api/status"]
    networks:
      - nexapay-backend

  # ==========================================================
  # PROMETHEUS + GRAFANA
  # ==========================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: nexapay-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    healthcheck:
      interval: 15s
      timeout: 5s
      retries: 3
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
    networks:
      - nexapay-backend

  grafana:
    image: grafana/grafana:latest
    container_name: nexapay-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-nexapay_admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "true"
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/docker/monitoring/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/nexapay-overview.json:ro
    healthcheck:
      interval: 15s
      timeout: 5s
      retries: 3
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
    networks:
      - nexapay-backend

  # ==========================================================
  # MICROSERVICES
  # ==========================================================
  auth-service:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: nexapay-auth-service
    restart: unless-stopped
    ports:
      - "4001:4001"
      - "50051:50051"
    environment:
      NODE_ENV: development
      SERVICE_NAME: auth
      SERVICE_PORT: 4001
      AUTH_SERVICE_GRPC_PORT: 50051
      DATABASE_URL: ${DATABASE_URL:-postgresql://nexapay:nexapay_pass@postgres-auth:5432/nexapay_auth}
      REDIS_URL: redis://redis:6379/0
      JWT_ACCESS_SECRET: change-me-access-secret-min-32-chars
      JWT_REFRESH_SECRET: change-me-refresh-secret-min-32-chars
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      JWT_ISSUER: nexapay-auth
      TOTP_ISSUER: NexaPay
      KAFKA_BROKERS: kafka:29092
      LOG_LEVEL: debug
    depends_on:
      postgres-auth:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      interval: 30s
      timeout: 5s
      retries: 3
      test: ["CMD", "wget", "-qO-", "http://localhost:4001/health"]
    logging: *default-logging
    networks:
      - nexapay-backend

  user-kyc-service:
    build:
      context: ./services/user-kyc
      dockerfile: Dockerfile
    container_name: nexapay-user-kyc-service
    restart: unless-stopped
    ports:
      - "4002:4002"
    environment:
      NODE_ENV: development
      SERVICE_NAME: user-kyc
      SERVICE_PORT: 4002
      DATABASE_URL: ${DATABASE_URL:-postgresql://nexapay:nexapay_pass@postgres-users:5432/nexapay_users}
      MONGO_URL: ${MONGO_URL:-mongodb://nexapay:nexapay_pass@mongo:27017/nexapay_kyc}
      AWS_S3_REGION: us-east-1
      AWS_S3_BUCKET_KYC: nexapay-kyc-documents
      AWS_S3_BUCKET_AVATAR: nexapay-user-avatars
      KAFKA_BROKERS: kafka:29092
      LOG_LEVEL: debug
    depends_on:
      postgres-users:
        condition: service_healthy
      mongo:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      interval: 30s
      timeout: 5s
      retries: 3
      test: ["CMD", "wget", "-qO-", "http://localhost:4002/health"]
    logging: *default-logging
    networks:
      - nexapay-backend

  wallet-service:
    build:
      context: ./services/wallet
      dockerfile: Dockerfile
    container_name: nexapay-wallet-service
    restart: unless-stopped
    ports:
      - "4003:4003"
      - "50052:50052"
    environment:
      NODE_ENV: development
      SERVICE_NAME: wallet
      SERVICE_PORT: 4003
      WALLET_SERVICE_GRPC_PORT: 50052
      DATABASE_URL: ${DATABASE_URL:-postgresql://nexapay:nexapay_pass@postgres-wallets:5432/nexapay_wallets}
      REDIS_URL: redis://redis:6379/1
      WALLET_CACHE_TTL: 300
      KAFKA_BROKERS: kafka:29092
      LOG_LEVEL: debug
    depends_on:
      postgres-wallets:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      interval: 30s
      timeout: 5s
      retries: 3
      test: ["CMD", "wget", "-qO-", "http://localhost:4003/health"]
    logging: *default-logging
    networks:
      - nexapay-backend

  loan-service:
    build:
      context: ./services/loan
      dockerfile: Dockerfile
    container_name: nexapay-loan-service
    restart: unless-stopped
    ports:
      - "4004:4004"
    environment:
      NODE_ENV: development
      SERVICE_NAME: loan
      SERVICE_PORT: 4004
      DATABASE_URL: ${DATABASE_URL:-postgresql://nexapay:nexapay_pass@postgres-loans:5432/nexapay_loans}
      REDIS_URL: redis://redis:6379/2
      KAFKA_BROKERS: kafka:29092
      LOG_LEVEL: debug
    depends_on:
      postgres-loans:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      interval: 30s
      timeout: 5s
      retries: 3
      test: ["CMD", "wget", "-qO-", "http://localhost:4004/health"]
    logging: *default-logging
    networks:
      - nexapay-backend

  investment-service:
    build:
      context: ./services/investment
      dockerfile: Dockerfile
    container_name: nexapay-investment-service
    restart: unless-stopped
    ports:
      - "4005:4005"
    environment:
      NODE_ENV: development
      SERVICE_NAME: investment
      SERVICE_PORT: 4005
      MONGO_URL: ${MONGO_URL:-mongodb://nexapay:nexapay_pass@mongo:27017/nexapay_investments}
      REDIS_URL: redis://redis:6379/3
      KAFKA_BROKERS: kafka:29092
      LOG_LEVEL: debug
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      interval: 30s
      timeout: 5s
      retries: 3
      test: ["CMD", "wget", "-qO-", "http://localhost:4005/health"]
    logging: *default-logging
    networks:
      - nexapay-backend

  notification-service:
    build:
      context: ./services/notification
      dockerfile: Dockerfile
    container_name: nexapay-notification-service
    restart: unless-stopped
    ports:
      - "4006:4006"
    environment:
      NODE_ENV: development
      SERVICE_NAME: notification
      SERVICE_PORT: 4006
      MONGO_URL: ${MONGO_URL:-mongodb://nexapay:nexapay_pass@mongo:27017/nexapay_notifications}
      REDIS_URL: redis://redis:6379/4
      KAFKA_BROKERS: kafka:29092
      SMTP_HOST: smtp.sendgrid.net
      SMTP_PORT: 587
      SMTP_USER: apikey
      LOG_LEVEL: debug
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      interval: 30s
      timeout: 5s
      retries: 3
      test: ["CMD", "wget", "-qO-", "http://localhost:4006/health"]
    logging: *default-logging
    networks:
      - nexapay-backend

  reporting-service:
    build:
      context: ./services/reporting
      dockerfile: Dockerfile
    container_name: nexapay-reporting-service
    restart: unless-stopped
    ports:
      - "4007:4007"
    environment:
      NODE_ENV: development
      SERVICE_NAME: reporting
      SERVICE_PORT: 4007
      MYSQL_URL: ${MYSQL_URL:-mysql://nexapay:nexapay_pass@mysql:3306/nexapay_reporting}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      LOG_LEVEL: debug
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      interval: 30s
      timeout: 5s
      retries: 3
      test: ["CMD", "wget", "-qO-", "http://localhost:4007/health"]
    logging: *default-logging
    networks:
      - nexapay-backend

  fraud-detection-service:
    build:
      context: ./services/fraud-detection
      dockerfile: Dockerfile
    container_name: nexapay-fraud-detection-service
    restart: unless-stopped
    ports:
      - "4008:4008"
    environment:
      NODE_ENV: development
      SERVICE_NAME: fraud-detection
      SERVICE_PORT: 4008
      REDIS_URL: redis://redis:6379/5
      KAFKA_BROKERS: kafka:29092
      FRAUD_RATE_LIMIT_WINDOW_MS: 60000
      FRAUD_RATE_LIMIT_MAX: 100
      LOG_LEVEL: debug
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      interval: 30s
      timeout: 5s
      retries: 3
      test: ["CMD", "wget", "-qO-", "http://localhost:4008/health"]
    logging: *default-logging
    networks:
      - nexapay-backend

  # ==========================================================
  # API GATEWAY (Express BFF)
  # ==========================================================
  api-gateway:
    build:
      context: ./apps/api-gateway
      dockerfile: Dockerfile
    container_name: nexapay-api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      SERVICE_NAME: api-gateway
      PORT: 3000
      CORS_ORIGINS: http://localhost:3001,http://localhost:3002,http://localhost:8100
      AUTH_SERVICE_URL: http://auth-service:4001
      USER_KYC_SERVICE_URL: http://user-kyc-service:4002
      WALLET_SERVICE_URL: http://wallet-service:4003
      LOAN_SERVICE_URL: http://loan-service:4004
      INVESTMENT_SERVICE_URL: http://investment-service:4005
      NOTIFICATION_SERVICE_URL: http://notification-service:4006
      REPORTING_SERVICE_URL: http://reporting-service:4007
      FRAUD_SERVICE_URL: http://fraud-detection-service:4008
      LOG_LEVEL: debug
    depends_on:
      auth-service:
        condition: service_started
      user-kyc-service:
        condition: service_started
      wallet-service:
        condition: service_started
      loan-service:
        condition: service_started
      investment-service:
        condition: service_started
      notification-service:
        condition: service_started
      reporting-service:
        condition: service_started
      fraud-detection-service:
        condition: service_started
    healthcheck:
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
    logging: *default-logging
    networks:
      - nexapay-backend
      - nexapay-frontend

  # ==========================================================
  # KONG API GATEWAY (Optional - Enterprise)
  # ==========================================================
  kong-database:
    image: postgres:13-alpine
    container_name: nexapay-kong-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kong_pass}
      POSTGRES_DB: kong
    volumes:
      - kong-db-data:/var/lib/postgresql/data
    healthcheck:
      <<: *db-healthcheck
      test: ["CMD-SHELL", "pg_isready -U kong -d kong"]
    networks:
      - nexapay-backend
    profiles:
      - kong

  kong-migration:
    image: kong:3.6
    container_name: nexapay-kong-migration
    restart: "no"
    depends_on:
      kong-database:
        condition: service_healthy
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: ${KONG_PG_PASSWORD:-kong_pass}
      KONG_PG_DATABASE: kong
    command: "kong migrations bootstrap"
    networks:
      - nexapay-backend
    profiles:
      - kong

  kong:
    image: kong:3.6
    container_name: nexapay-kong
    restart: unless-stopped
    depends_on:
      kong-database:
        condition: service_healthy
      kong-migration:
        condition: service_completed_successfully
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: ${KONG_PG_PASSWORD:-kong_pass}
      KONG_PG_DATABASE: kong
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
      - "8444:8444"
    healthcheck:
      interval: 15s
      timeout: 5s
      retries: 3
      test: ["CMD", "kong", "health"]
    networks:
      - nexapay-backend
      - nexapay-frontend
    profiles:
      - kong

  konga:
    image: pantsel/konga:latest
    container_name: nexapay-konga
    restart: unless-stopped
    depends_on:
      kong:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TOKEN_SECRET: ${TOKEN_SECRET:-nexapay_konga_secret_2024}
    ports:
      - "1337:1337"
    networks:
      - nexapay-backend
      - nexapay-frontend
    profiles:
      - kong

  # ==========================================================
  # EXPORTERS
  # ==========================================================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: nexapay-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: ${DATA_SOURCE_NAME:-postgresql://nexapay:nexapay_pass@postgres-auth:5432/nexapay_auth?sslmode=disable}
    ports:
      - "9187:9187"
    depends_on:
      postgres-auth:
        condition: service_healthy
    networks:
      - nexapay-backend
    profiles:
      - monitoring

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: nexapay-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nexapay-backend
    profiles:
      - monitoring

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: nexapay-kafka-exporter
    restart: unless-stopped
    command:
      - "--kafka.server=kafka:29092"
    ports:
      - "9308:9308"
    depends_on:
      kafka:
        condition: service_started
    networks:
      - nexapay-backend
    profiles:
      - monitoring

# ==========================================================
# VOLUMES
# ==========================================================
volumes:
  postgres-auth-data:
    driver: local
  postgres-users-data:
    driver: local
  postgres-wallets-data:
    driver: local
  postgres-loans-data:
    driver: local
  mysql-data:
    driver: local
  mongo-data:
    driver: local
  redis-data:
    driver: local
  zookeeper-data:
    driver: local
  zookeeper-log:
    driver: local
  kafka-data:
    driver: local
  elasticsearch-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  kong-db-data:
    driver: local

# ==========================================================
# NETWORKS
# ==========================================================
networks:
  nexapay-backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
  nexapay-frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16
          gateway: 172.29.0.1
