_format_version: "3.0"
_transform: true

services:
  - name: auth-service
    url: http://auth:3001
    routes:
      - name: auth-routes
        paths:
          - /api/v1/auth
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
        plugins:
          - name: rate-limiting
            config:
              minute: 60
              hour: 1000
              policy: local

  - name: user-kyc-service
    url: http://user-kyc:3002
    routes:
      - name: user-kyc-routes
        paths:
          - /api/v1/users
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
        plugins:
          - name: rate-limiting
            config:
              minute: 30
              hour: 500
              policy: local
          - name: cors
            config:
              origins:
                - "*"
              methods:
                - GET
                - POST
                - PUT
                - PATCH
                - DELETE
              headers:
                - Authorization
                - Content-Type
                - Idempotency-Key
              exposed_headers:
                - X-Request-Id

  - name: wallet-service
    url: http://wallet:3003
    routes:
