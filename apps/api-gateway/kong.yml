          - DELETE
        plugins:
          - name: rate-limiting
            config:
              minute: 30
              hour: 500
              policy: local
          - name: cors
            config:
              origins:
                - "*"
              methods:
                - GET
                - POST
                - PUT
                - PATCH
                - DELETE
              headers:
                - Authorization
