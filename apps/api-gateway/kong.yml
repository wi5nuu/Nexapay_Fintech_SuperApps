consumers:
  - username: internal-service
    custom_id: internal-svc
    keyauth_credentials:
      - key: nexapay-internal-key

  - username: anonymous
    custom_id: anonymous

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
        - Idempotency-Key
        - X-Request-Id
      exposed_headers:
        - X-Request-Id
        - X-Balance
        - X-RateLimit-Remaining
      credentials: true
      max_age: 3600

  - name: rate-limiting
    config:
      minute: 60
      hour: 2000
      policy: local

  - name: request-transformer
    config:
      add:
        headers:
          - X-Gateway-Proxy:kong

  - name: correlation-id
    config:
      header_name: X-Request-Id
      generator: uuid#counter
      echo_downstream: true
